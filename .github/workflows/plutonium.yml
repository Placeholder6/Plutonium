name: Plutonium Downloader (Rust)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Plutonium Rust Updater
        run: |
          # Fetch the latest release version and download the Linux binary using jq for robustness
          LATEST_URL=$(curl -s https://api.github.com/repos/mxve/plutonium-updater.rs/releases/latest | jq -r '.assets[] | select(.name | contains("linux-gnu.tar.gz")) | .browser_download_url')
          echo "Downloading from $LATEST_URL"
          curl -L -o updater.tar.gz "$LATEST_URL"
          tar -xzf updater.tar.gz
          # List files to verify binary name
          ls -R
          # Make sure any binary found is executable (guessing the name is plutonium-updater)
          find . -name "plutonium-updater" -exec chmod +x {} \;

      - name: Run Updater
        run: |
          # Find the binary (it might be in a subdirectory after extraction)
          UPDATER_PATH=$(find . -name "plutonium-updater" -type f -executable | head -n 1)
          if [ -z "$UPDATER_PATH" ]; then
            echo "Error: Could not find plutonium-updater binary"
            exit 1
          fi
          echo "Running updater from $UPDATER_PATH"
          # -l: Download launcher assets
          # -d: Specify directory
          "$UPDATER_PATH" -l -d ./plutonium_data

      - name: Prepare Files for Upload
        run: |
          # Create a bundle of the downloaded data
          zip -r plutonium_bundle.zip ./plutonium_data

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plutonium-bundle
          path: plutonium_bundle.zip
          retention-days: 5
