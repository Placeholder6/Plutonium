name: Plutonium Downloader (Rust)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Plutonium Rust Updater
        run: |
          # Fetch the latest release version and download the Linux binary
          LATEST_URL=$(curl -s https://api.github.com/repos/mxve/plutonium-updater.rs/releases/latest | grep "browser_download_url.*linux-gnu.tar.gz" | cut -d : -f 2,3 | tr -d \")
          echo "Downloading from $LATEST_URL"
          curl -L -o updater.tar.gz "$LATEST_URL"
          tar -xzf updater.tar.gz
          # The binary name is usually plutonium-updater
          chmod +x plutonium-updater

      - name: Run Updater
        run: |
          # -l: Download launcher assets
          # -d: Specify directory
          ./plutonium-updater -l -d ./plutonium_data

      - name: Prepare Files for Upload
        run: |
          # Create a bundle of the downloaded data
          zip -r plutonium_bundle.zip ./plutonium_data

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plutonium-bundle
          path: plutonium_bundle.zip
          retention-days: 5
